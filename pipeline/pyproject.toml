[project]
name = "rehabtwin"
version = "0.1.0"
description = "Rehab Agent slice: video -> SKEL -> OpenSim (scale, IK), metrics, validation and session records"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opensim>=4.5",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
live = ["pylsl>=1.16", "python-osc>=1.8"]

[project.scripts]
rehabtwin = "rehabtwin.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rehabtwin"]

[tool.setuptools.package-data]
rehabtwin = []

[tool.pytest.ini_options]
testpaths = ["tests"]
